name: GuideCompanion
options:
  bundleIdPrefix: com.serpcompany
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    DEVELOPMENT_TEAM: 847HR8U8D9
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  GuideModules:
    path: Packages/GuideModules
targets:
  GuideCompanion:
    type: application
    platform: macOS
    productName: SERPy
    sources:
      - path: App
    dependencies:
      - package: GuideModules
        product: GuideCore
      - package: GuideModules
        product: GuideMac
      - package: GuideModules
        product: GuideUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.guidecompanion.internal
        PRODUCT_NAME: SERPy
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/GuideCompanion.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 38
        MARKETING_VERSION: 0.1.0
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          ARCHS: arm64
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_TESTABILITY: NO
    scheme:
      testTargets:
        - GuideCompanionUITests
      gatherCoverageData: true
  GuideCompanionUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: GuideCompanionUITests
    dependencies:
      - target: GuideCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.guidecompanion.internal.uitests
        GENERATE_INFOPLIST_FILE: YES
