name: verification

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence-contract:
    name: evidence-contract
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test and validate evidence contract
        run: |
          python3 scripts/test-issue-13-evidence-contract.py
          python3 scripts/validate-issue-13-evidence.py

  core-tests:
    name: core-tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove runner can fail and clean up
        run: scripts/test-ci-tool-portability.sh
      - name: Run bounded headless suite
        run: scripts/run-headless-check.sh core-tests

  app-build:
    name: app-build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile without launching
        run: scripts/run-headless-check.sh app-build
