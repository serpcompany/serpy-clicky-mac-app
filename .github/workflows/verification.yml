name: verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-tests:
    name: core-tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prove runner can fail and clean up
        run: scripts/test-headless-check.sh
      - name: Run bounded headless suite
        run: scripts/run-headless-check.sh core-tests

  app-build:
    name: app-build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile without launching
        run: scripts/run-headless-check.sh app-build
