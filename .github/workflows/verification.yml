name: verification

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence-honesty:
    name: evidence-honesty (cannot prove completion)
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Lint red or partial evidence only (cannot prove completion)
        run: scripts/run-headless-check.sh evidence-contract

  core-tests:
    name: core-tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prove runner can fail and clean up
        run: scripts/test-ci-tool-portability.sh
      - name: Run bounded headless suite
        run: scripts/run-headless-check.sh core-tests

  app-build:
    name: app-build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile without launching
        run: scripts/run-headless-check.sh app-build
